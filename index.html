<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Cards</title> 
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <div class="cards">
        <div class="card">
            <i class="fa-brands fa-twitter"></i>
            <h2>TWITTER</h2>
            <p>Connect with us on Twitter and stay updated with our latest news and updates.</p>
            <button>Follow</button>
        </div>
        <div class="card instagram">
            <i class="fa-brands fa-instagram"></i>
            <h2>INSTAGRAM</h2>
            <p>Follow us on Instagram for amazing photos, updates, and daily content.</p>
            <button>Follow</button>
        </div>
        <div class="card">
            <i class="fa-brands fa-youtube"></i>
            <h2>YOUTUBE</h2>
            <p>Subscribe to our YouTube channel for videos, tutorials, and more.</p>
            <button>Subscribe</button>
        </div>
    </div>
</body>
</html>
